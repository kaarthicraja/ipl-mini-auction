<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IPL Auction Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#05070a;
  --bg-1:#0b0f16;
  --bg-2:#121826;
  --glass:rgba(255,255,255,0.045);
  --glass-brd:rgba(255,255,255,0.09);
  --turf:#173d2b;
  --gold:#e8b94a;
  --gold-2:#f7d581;
  --flood:#4fd1ff;
  --danger:#ef4a5f;
  --good:#3ddc84;
  --ink:#eef1f6;
  --ink-dim:#9aa5b4;
  --ink-faint:#5c6779;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(79,209,255,0.08), transparent 60%),
    radial-gradient(ellipse 900px 500px at 100% 100%, rgba(232,185,74,0.06), transparent 60%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1) 40%,var(--bg-0));
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100%;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
  z-index:0;
}
.flood-glow{
  position:fixed; top:-200px; left:50%; transform:translateX(-50%);
  width:900px;height:500px;
  background:radial-gradient(ellipse at center, rgba(232,185,74,0.10), transparent 65%);
  filter:blur(20px); pointer-events:none; z-index:0;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
.mono{font-family:'JetBrains Mono',monospace;}
.h-display{font-family:'Anton',sans-serif;letter-spacing:0.5px;text-transform:uppercase;}
.h-condensed{font-family:'Teko',sans-serif;font-weight:700;letter-spacing:0.5px;}

/* ---------- layout shells ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--glass-brd);
  background:rgba(5,7,10,0.7); backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(135deg,var(--gold),#a9781f);
  display:flex;align-items:center;justify-content:center;
  font-family:'Anton',sans-serif;color:#1a1305;font-size:15px;
}
.brand .name{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:1px;text-transform:uppercase;}
.brand .name span{color:var(--gold);}
.room-chip{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);
  padding:6px 12px;border:1px solid var(--glass-brd);border-radius:20px;background:var(--glass);
  display:flex;align-items:center;gap:8px;
}
.room-chip b{color:var(--gold-2);letter-spacing:2px;}
.main{flex:1;padding:22px;max-width:1280px;margin:0 auto;width:100%;}
.center-wrap{max-width:520px;margin:60px auto;padding:0 16px;}

/* ---------- glass card ---------- */
.card{
  background:var(--glass);
  border:1px solid var(--glass-brd);
  border-radius:16px;
  padding:22px;
  backdrop-filter:blur(6px);
}
.card + .card{margin-top:16px;}

/* ---------- buttons/inputs ---------- */
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
.btn{
  padding:13px 22px;border-radius:11px;font-weight:700;font-size:14.5px;
  background:var(--glass); color:var(--ink); border:1px solid var(--glass-brd);
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{background:rgba(255,255,255,0.09);}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn-gold{
  background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,#b98620);
  color:#1a1305; border:none; box-shadow:0 6px 22px rgba(232,185,74,0.25);
}
.btn-gold:hover{filter:brightness(1.06);}
.btn-danger{background:rgba(239,74,95,0.14); color:#ff8a97; border:1px solid rgba(239,74,95,0.35);}
.btn-flood{background:rgba(79,209,255,0.14); color:var(--flood); border:1px solid rgba(79,209,255,0.35);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:8px;}
input[type=text]{
  width:100%; padding:13px 14px; border-radius:10px;
  background:rgba(255,255,255,0.04); border:1px solid var(--glass-brd);
  color:var(--ink); font-size:15px; font-family:'JetBrains Mono',monospace; letter-spacing:1px;
  outline:none;
}
input[type=text]:focus{border-color:var(--gold);}
input[type=text]::placeholder{color:var(--ink-faint); letter-spacing:normal; font-family:'Inter',sans-serif;}
label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-faint);font-weight:700;display:block;margin-bottom:7px;}
.err{color:var(--danger);font-size:13px;margin-top:8px;}
.dim{color:var(--ink-dim);}
.faint{color:var(--ink-faint);}
a.link{color:var(--flood);text-decoration:none;}

/* ---------- home screen ---------- */
.hero-title{font-family:'Anton',sans-serif;font-size:44px;text-align:center;line-height:1.05;letter-spacing:1px;text-transform:uppercase;}
.hero-title span{color:var(--gold);}
.hero-sub{text-align:center;color:var(--ink-dim);margin:10px 0 34px;font-size:14.5px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;background:rgba(255,255,255,0.03);padding:4px;border-radius:12px;border:1px solid var(--glass-brd);}
.tab{flex:1;text-align:center;padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-dim);background:transparent;}
.tab.active{background:var(--glass); color:var(--ink); box-shadow:inset 0 0 0 1px var(--glass-brd);}

/* ---------- lobby ---------- */
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.lobby-grid{grid-template-columns:1fr;}}
.player-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.03);
  border:1px solid var(--glass-brd); margin-bottom:8px;
}
.player-row .left{display:flex;align-items:center;gap:10px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.on{background:var(--good); box-shadow:0 0 8px var(--good);}
.dot.off{background:var(--danger);}
.tagpill{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
.tag-host{background:rgba(232,185,74,0.18);color:var(--gold-2);}
.tag-you{background:rgba(79,209,255,0.15);color:var(--flood);}

/* ---------- team grid ---------- */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.team-card{
  border-radius:14px;padding:16px 14px;position:relative;overflow:hidden;
  border:1px solid var(--glass-brd); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  min-height:118px; display:flex;flex-direction:column;justify-content:space-between;
}
.team-card:hover{transform:translateY(-3px);}
.team-card.taken{opacity:0.4;cursor:not-allowed;}
.team-card.mine{box-shadow:0 0 0 2px var(--gold), 0 10px 26px rgba(232,185,74,0.18);}
.team-abbr{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:1px;}
.team-name{font-size:11.5px;color:rgba(255,255,255,0.75);margin-top:2px;}
.team-status{font-size:10.5px;font-weight:800;letter-spacing:1px;margin-top:10px;text-transform:uppercase;}

/* ---------- retention / pool ---------- */
.pool-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
select{
  background:#161c28 !important; border:1px solid var(--gold) !important; color:#f7d581 !important;
  padding:9px 12px; border-radius:9px; font-size:13px; font-weight:600; font-family:'Inter',sans-serif;
  cursor:pointer; outline:none; box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
select option{
  background-color:#161c28 !important; color:#ffffff !important; padding:10px; font-weight:600;
}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;max-height:700px;overflow-y:auto;padding-right:4px;}
.pgrid-scroll::-webkit-scrollbar{width:6px;}
.pgrid-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:10px;}
.pcard{
  border-radius:13px;padding:13px;background:rgba(255,255,255,0.035);
  border:1px solid var(--glass-brd);
}
.pcard .avatar{
  width:100%;aspect-ratio:1.6;border-radius:9px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:22px;
  background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));
  color:rgba(255,255,255,0.5);
}
.pname{font-weight:700;font-size:14px;}
.pmeta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;}
.rating-badge{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:var(--gold-2);}
.role-badge{font-size:9.5px;font-weight:800;letter-spacing:0.5px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,0.08);text-transform:uppercase;}

/* ---------- auction stage ---------- */
.auction-layout{display:grid;grid-template-columns:230px 1fr 260px;gap:16px;}
@media(max-width:980px){.auction-layout{grid-template-columns:1fr;}}
.stage{
  border-radius:20px;padding:30px 20px;text-align:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%, rgba(232,185,74,0.10), transparent 65%), var(--glass);
  border:1px solid var(--glass-brd);
}
.stage-role{color:var(--gold-2);font-size:12px;letter-spacing:3px;font-weight:800;text-transform:uppercase;}
.stage-avatar{
  width:110px;height:110px;border-radius:50%;margin:14px auto;
  background:linear-gradient(135deg,rgba(255,255,255,0.10),rgba(255,255,255,0.02));
  display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:38px;
  border:2px solid var(--glass-brd);
}
.stage-name{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:0.5px;text-transform:uppercase;}
.stage-sub{color:var(--ink-dim);font-size:13px;margin-top:4px;}
.stage-stats{display:flex;justify-content:center;gap:26px;margin-top:16px;}
.stage-stat .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--gold-2);}
.stage-stat .lbl{font-size:10px;color:var(--ink-faint);letter-spacing:1.5px;text-transform:uppercase;}
.bid-box{margin-top:22px;padding:18px;border-radius:14px;background:rgba(0,0,0,0.25);border:1px solid var(--glass-brd);}
.bid-label{font-size:11px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;}
.bid-amount{font-family:'Anton',sans-serif;font-size:52px;color:var(--gold-2);line-height:1.1;margin-top:2px;}
.bid-leader{margin-top:8px;font-size:13.5px;color:var(--flood);font-weight:700;}
.timer-ring{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;}
.timer-num{font-family:'Anton',sans-serif;font-size:28px;}
.timer-num.warn{color:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.sold-flash{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(5,7,10,0.88); z-index:5; animation:fadein .25s ease;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.sold-flash .big{font-family:'Anton',sans-serif;font-size:46px;letter-spacing:1px;}
.sold-flash .big.sold{color:var(--good);}
.sold-flash .big.unsold{color:var(--danger);}

.side-panel{max-height:640px;overflow-y:auto;}
.mini-team{
  padding:11px 12px;border-radius:10px;background:rgba(255,255,255,0.03);
  border:1px solid var(--glass-brd);margin-bottom:9px;
}
.mini-team.active-bidder{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
.mini-team .top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;}
.mini-bar{height:5px;border-radius:3px;background:rgba(255,255,255,0.08);margin-top:7px;overflow:hidden;}
.mini-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));}
.feed-item{font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.feed-item b{color:var(--gold-2);}

.mybid-panel{padding:18px;border-radius:14px;background:linear-gradient(180deg,rgba(232,185,74,0.06),transparent);border:1px solid var(--glass-brd);}
.next-bid-amt{font-family:'Anton',sans-serif;font-size:30px;color:var(--gold-2);}

/* ---------- team dashboard / results ---------- */
.stat-row{display:flex;gap:14px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:110px;background:rgba(255,255,255,0.035);border:1px solid var(--glass-brd);border-radius:12px;padding:13px;}
.stat-box .num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--gold-2);}
.stat-box .lbl{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.progress{height:9px;border-radius:5px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:6px;}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));}
.squad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px;}
.leaderboard-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-brd);margin-bottom:10px;}
.rank-badge{font-family:'Anton',sans-serif;font-size:20px;width:38px;text-align:center;color:var(--gold-2);}
.champion-banner{text-align:center;padding:40px 20px;border-radius:20px;background:radial-gradient(ellipse at 50% 0%,rgba(232,185,74,0.16),transparent 70%),var(--glass);border:1px solid var(--glass-brd);}
.champion-banner .trophy{font-size:44px;}
.champion-banner .title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:3px;color:var(--gold-2);margin-top:6px;}
.champion-banner .teamname{font-family:'Anton',sans-serif;font-size:48px;margin-top:8px;}
.champion-banner .score{font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--gold-2);margin-top:6px;}

.host-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.phase-pill{display:inline-block;padding:5px 12px;border-radius:20px;background:rgba(79,209,255,0.12);color:var(--flood);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
.warn-banner{padding:12px 14px;border-radius:10px;background:rgba(239,74,95,0.10);border:1px solid rgba(239,74,95,0.3);color:#ff9ba5;font-size:13px;margin-bottom:14px;}
.section-title{font-family:'Teko',sans-serif;font-weight:700;font-size:22px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);margin-bottom:12px;}
.empty-state{text-align:center;color:var(--ink-faint);padding:30px;font-size:13.5px;}
.footer-note{text-align:center;color:var(--ink-faint);font-size:11px;padding:24px;}
::selection{background:rgba(232,185,74,0.3);}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>

/* ---------------- Storage helpers ----------------
   Dual mode: if window.storage exists (Claude Artifacts runtime), use it.
   Otherwise (standalone deploy on Vercel/Render/etc.) talk to our own
   lightweight /api/room REST backend (see server.js) so the game still
   has one authoritative shared source of truth. */
const HAS_ARTIFACT_STORAGE = (typeof window !== "undefined") && !!window.storage;

// Fetch with timeout to avoid hanging on slow servers
function fetchWithTimeout(url, opts, ms=8000){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, {...opts, signal:ctrl.signal}).finally(()=>clearTimeout(timer));
}
async function loadRoom(code){
  try{
    if(HAS_ARTIFACT_STORAGE){
      const r = await window.storage.get("room:"+code, true);
      return r ? JSON.parse(r.value) : null;
    } else {
      const res = await fetchWithTimeout("/api/room/"+encodeURIComponent(code), {});
      if(!res.ok) return null;
      const data = await res.json();
      return data && data.value ? JSON.parse(data.value) : null;
    }
  }catch(e){ return null; }
}
async function saveRoom(code, state){
  state.version = (state.version||0)+1;
  state.updatedAt = Date.now();
  try{
    if(HAS_ARTIFACT_STORAGE){
      await window.storage.set("room:"+code, JSON.stringify(state), true);
    } else {
      const res = await fetchWithTimeout("/api/room/"+encodeURIComponent(code), {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({value: JSON.stringify(state)})
      });
      if(!res.ok) return false;
    }
    return true;
  }catch(e){ console.error("save failed",e); return false; }
}
// Phase ordering for regression guard
const PHASE_ORDER = {lobby:0, teamselect:1, retention:2, auction:3, results:4};

// Strip any null/undefined entries from pool, managers, and squads
function sanitizeState(st){
  if(!st) return st;
  if(Array.isArray(st.pool)) st.pool = st.pool.filter(p=>p!=null);
  if(Array.isArray(st.managers)){
    st.managers = st.managers.filter(m=>m!=null);
    st.managers.forEach(m=>{
      if(Array.isArray(m.squad)) m.squad = m.squad.filter(s=>s!=null);
    });
  }
  return st;
}

// read-modify-write helper to shrink race window
async function mutateRoom(code, mutator){
  // Use whichever is newer: server or local
  let cur = await loadRoom(code);
  if(!cur){
    cur = S.room;
  } else if(S.room && S.roomCode === code){
    const localVersion = S.room.version || 0;
    const serverVersion = cur.version || 0;
    if(localVersion > serverVersion) cur = S.room; // local is newer
  }
  if(!cur) return null;
  // Sanitize before cloning so mutator never sees nulls
  const clone = sanitizeState(JSON.parse(JSON.stringify(cur)));
  const next = mutator(clone);
  if(next===false) return cur; // mutator aborted
  sanitizeState(next); // sanitize result too
  await saveRoom(code, next);
  if(S.roomCode===code){
    S.room = sanitizeState(next);
    render();
  }
  return next;
}

/* ---------------- Initial state builders ---------------- */
function freshPool(){
  return PLAYERS.map(p=>({...p, status:"available", ownerId:null, price:0}));
}
function newManager(id,name,isHost){
  return {id,name,isHost:!!isHost,team:null,purse:START_PURSE,squad:[],connected:true,lastSeen:Date.now()};
}
function initialRoomState(code, hostId, hostName){
  return {
    version:0, code, phase:"lobby",
    managers:[newManager(hostId,hostName,true)],

    pool:freshPool(),

    bidFeed:[], history:[], results:null
  };
}

/* ---------------- Rendering root ---------------- */
const app = document.getElementById("app");
function render(){
  if(!S.room){ renderHome(); return; }
  const phase = S.room.phase;
  if(phase==="lobby") renderLobby();
  else if(phase==="teamselect") renderTeamSelect();
  else if(phase==="retention") renderRetention();
  else if(phase==="auction") renderAuction();
  else if(phase==="results") renderResults();
  else renderLobby();

/* ---------------- Poll loop ---------------- */
function startPolling(){
  stopPolling();
  S.poll = setInterval(async ()=>{
    if(!S.roomCode) return;
    const r = await loadRoom(S.roomCode);
    if(r){
      const currentVersion = S.room ? (S.room.version || 0) : -1;
      const newVersion = r.version || 0;
      const currentPhaseOrder = S.room ? (PHASE_ORDER[S.room.phase] || 0) : -1;
      const newPhaseOrder = PHASE_ORDER[r.phase] || 0;

      // Never regress the phase backwards (e.g. don't overwrite retention -> teamselect)
      // Accept if: we have no state, server is newer version, or server phase is same/newer
      const serverIsNewer = newVersion > currentVersion;
      const phaseIsNewer = newPhaseOrder > currentPhaseOrder;
      const samePhase = newPhaseOrder === currentPhaseOrder && newVersion >= currentVersion;

      if(!S.room || serverIsNewer || phaseIsNewer || samePhase){
        // Never regress phase
        if(!S.room || newPhaseOrder >= currentPhaseOrder){
          const changed = !S.room || r.phase !== S.room.phase || newVersion !== currentVersion;
          S.room = sanitizeState(r);
          if(changed) render();
        }
      }
      maybeAutoAdvanceTeamSelect(S.room);
      maybeAutoAdvanceAuction(S.room);
    }
  }, 400);
  S.heartbeat = setInterval(async ()=>{
    if(!S.roomCode || !S.myId) return;
    await mutateRoom(S.roomCode, st=>{
      const m = st.managers.find(x=>x.id===S.myId);
      if(m) m.lastSeen = Date.now();
      return st;
    });
  }, 7000);
}
function stopPolling(){ if(S.poll) clearInterval(S.poll); if(S.heartbeat) clearInterval(S.heartbeat); }

function isConnected(m){ return (Date.now()-(m.lastSeen||0)) < 12000; }

async function maybeAutoAdvanceTeamSelect(r){
  if(!r || r.phase!=="teamselect") return;
  if(S.autoAdvanceGuard) return;
  const allPicked = r.managers.length > 0 && r.managers.every(m => !!m.team);
  const now = Date.now();
  const timeExpired = r.teamSelectEndsAt && now >= r.teamSelectEndsAt;
  if(allPicked || timeExpired){
    S.autoAdvanceGuard = true;
    try {
      await actionStartRetention();
    } catch(err){
      console.error("Auto-advance retention error:", err);
    } finally {
      S.autoAdvanceGuard = false;
    }
  }
}

/* Any client can drive the authoritative auction clock forward when it detects time has elapsed.
   Guarded so it's idempotent: mutator re-checks state right before writing. */
async function maybeAutoAdvanceAuction(r){
  if(r.phase!=="auction") return;
  const a = r.auction;
  if(!a) return;
  if(S.autoAdvanceGuard) return;
  const now = Date.now();
  if(a.status==="live" && a.endsAt && now >= a.endsAt){
    S.autoAdvanceGuard=true;
    await mutateRoom(S.roomCode, st=>finalizeCurrentPlayer(st));
    S.autoAdvanceGuard=false;
  } else if((a.status==="sold" || a.status==="unsold") && a.resultAt && now - a.resultAt > 3200){
    S.autoAdvanceGuard=true;
    await mutateRoom(S.roomCode, st=>advanceToNextPlayer(st));
    S.autoAdvanceGuard=false;
  }
}

/* ============================================================
   GAME LOGIC (pure mutators over a deep-cloned state)
   ============================================================ */
function finalizeCurrentPlayer(st){
  const a = st.auction;
  if(a.status!=="live") return false;
  const pool = st.pool.find(p=>p.id===a.currentPlayerId);
  if(!pool || pool.status!=="inAuction") return false; // already handled elsewhere
  if(a.currentBidderId){
    const mgr = st.managers.find(m=>m.id===a.currentBidderId);
    pool.status="sold"; pool.ownerId=mgr.id; pool.price=a.currentBid;
    mgr.purse = round2(mgr.purse - a.currentBid);
    mgr.squad.push({playerId:pool.id,name:pool.name,role:pool.role,country:pool.country,
      isOverseas:pool.isOverseas,rating:pool.rating,price:a.currentBid,retained:false});
    st.history.unshift({type:"sold",playerId:pool.id,name:pool.name,team:mgr.team,manager:mgr.name,price:a.currentBid,time:Date.now()});
    a.status="sold";
  } else {
    pool.status="unsold";
    st.history.unshift({type:"unsold",playerId:pool.id,name:pool.name,time:Date.now()});
    a.status="unsold";
  }
  a.resultAt = Date.now();
  return st;
}
function advanceToNextPlayer(st){
  const a = st.auction;
  if(a.status==="live") return false;
  if(allSquadsFull(st)){
    a.status="roundEnd"; a.currentPlayerId=null; a.currentBidderId=null;
    return st;
  }
  a.idx += 1;
  if(a.idx >= a.order.length){
    a.status="roundEnd"; a.currentPlayerId=null; a.currentBidderId=null;
    return st;
  }
  const pid = a.order[a.idx];
  const pool = st.pool.find(p=>p&&p.id===pid);
  const noMoreOverseas = allOverseasFull(st);
  if(!pool || pool.status!=="available" || (pool.isOverseas && noMoreOverseas)){
    return advanceToNextPlayer2(st);
  }
  pool.status="inAuction";
  a.currentPlayerId=pid; a.currentBid=pool.basePrice; a.currentBidderId=null;
  a.endsAt = Date.now()+10000; a.status="live";
  st.history.unshift({type:"enter",playerId:pid,name:pool.name,time:Date.now()});
  return st;
}
function advanceToNextPlayer2(st){
  // helper used when the picked order slot is stale; scan forward for next available
  const a = st.auction;
  const noMoreOverseas = allOverseasFull(st);
  const noMoreSquadRoom = allSquadsFull(st);
  // Auto-finish if all squads are full
  if(noMoreSquadRoom){
    a.status="roundEnd"; a.currentPlayerId=null; a.currentBidderId=null;
    return st;
  }
  while(a.idx < a.order.length){
    const pid = a.order[a.idx];
    const pool = st.pool.find(p=>p&&p.id===pid);
    if(pool && pool.status==="available"){
      // Skip overseas players if everyone has full overseas slots
      if(pool.isOverseas && noMoreOverseas){ a.idx+=1; continue; }
      pool.status="inAuction";
      a.currentPlayerId=pid; a.currentBid=pool.basePrice; a.currentBidderId=null;
      a.endsAt=Date.now()+10000; a.status="live";
      st.history.unshift({type:"enter",playerId:pid,name:pool.name,time:Date.now()});
      return st;
    }
    a.idx += 1;
  }
  a.status="roundEnd"; a.currentPlayerId=null;
  return st;
}

function allOverseasFull(st){
  // Returns true only when EVERY manager has hit MAX_OVERSEAS
  return st.managers.every(m=>(m.squad||[]).filter(s=>s&&s.isOverseas).length >= MAX_OVERSEAS);
}
function allSquadsFull(st){
  return st.managers.every(m=>(m.squad||[]).length >= MAX_SQUAD);
}
function canBid(mgr, pool, bidAmt){
  if(!mgr || !pool) return {ok:false,reason:"n/a"};
  if(mgr.squad.length >= MAX_SQUAD) return {ok:false,reason:`Squad full (${MAX_SQUAD}/${MAX_SQUAD})`};
  if(pool.isOverseas){
    const overseasCount = mgr.squad.filter(s=>s&&s.isOverseas).length;
    if(overseasCount >= MAX_OVERSEAS) return {ok:false,reason:`Overseas limit reached (${MAX_OVERSEAS}/${MAX_OVERSEAS})`};
  }
  if(mgr.purse < bidAmt) return {ok:false,reason:"Insufficient purse"};
  return {ok:true};
}

async function actionCreateRoom(name){
  const code = genRoomCode();
  const id = slug(name);
  const state = initialRoomState(code, id, name.trim());
  const ok = await saveRoom(code, state);
  if(!ok){ S.err="Could not create room. Try again."; render(); return; }
  S.roomCode=code; S.myId=id; S.myName=name.trim(); S.room=state; S.err=null;
  startPolling(); render();
}
async function actionJoinRoom(code, name){
  code = code.trim().toUpperCase();
  const room = await loadRoom(code);
  if(!room){ S.joinErr="Room not found. Check the code."; render(); return; }
  const id = slug(name);
  let existing = room.managers.find(m=>m.id===id);
  if(!existing){
    if(room.managers.length>=MAX_MANAGERS){ S.joinErr=`Room is full (${MAX_MANAGERS}/${MAX_MANAGERS} managers).`; render(); return; }
    if(room.phase!=="lobby"){ S.joinErr="Game already in progress — ask the host for the exact name you used, or wait for the next game."; render(); return; }
    room.managers.push(newManager(id,name.trim(),false));
    await saveRoom(code, room);
  } else {
    existing.connected=true; existing.lastSeen=Date.now();
    await saveRoom(code, room);
  }
  S.roomCode=code; S.myId=id; S.myName=name.trim(); S.room=await loadRoom(code); S.joinErr=null;
  startPolling(); render();
}
async function actionStartTeamSelect(){
  const timerMs = 138 * 1000; // 2.3 minutes = 138 seconds
  const endsAt = Date.now() + timerMs;
  if(S.room){
    S.room.phase = "teamselect";
    S.room.teamSelectEndsAt = endsAt;
    render();
  }
  await mutateRoom(S.roomCode, st=>{
    if(st.managers.length<2) return false;
    st.phase="teamselect";
    st.teamSelectEndsAt = endsAt;
    return st;
  });
}
async function actionPickTeam(teamId){
  await mutateRoom(S.roomCode, st=>{
    if(!st.teamsTaken) st.teamsTaken = {};
    if(st.teamsTaken[teamId]) return false;
    const m = st.managers.find(x=>x.id===S.myId);
    if(!m || m.team) return false;
    if(m.team) delete st.teamsTaken[m.team];
    m.team = teamId; st.teamsTaken[teamId]=m.id;
    return st;
  });
  // NOTE: do NOT call maybeAutoAdvanceTeamSelect here — it causes nested renders/crashes.
  // The poll loop handles auto-advance safely every 400ms.
}
async function actionStartRetention(){
  if(!S.room) return;

  // ---- STEP 1: Optimistic render (synchronous, no await) ----
  // Do this BEFORE any network calls so UI responds instantly
  if(S.room.phase !== "retention"){
    if(!S.room.teamsTaken) S.room.teamsTaken = {};
    const takenIds = new Set(Object.keys(S.room.teamsTaken));
    const availTeams = TEAMS.filter(t=>!takenIds.has(t.id)).map(t=>t.id);
    S.room.managers.forEach(m=>{
      if(!m.team && availTeams.length > 0){
        const t = availTeams.shift();
        m.team = t;
        S.room.teamsTaken[t] = m.id;
      }
    });
    S.room.phase = "retention";
    S.room.version = (S.room.version || 0) + 50; // regression guard
    render(); // shows Retention page immediately
  }

  // ---- STEP 2: Server write (async, background) ----
  // We snapshot what we want to save before the await
  const snapshot = JSON.parse(JSON.stringify(S.room));
  try{
    await saveRoom(S.roomCode, snapshot);
    // Sync S.room with the saved snapshot (saveRoom bumps version)
    if(S.roomCode){
      S.room = snapshot;
    }
  } catch(e){
    console.error("Save retention failed:", e);
    // Page already shows Retention; server will catch up on next poll
  }
}
async function actionRetainPlayer(playerId){
  await mutateRoom(S.roomCode, st=>{
    const m = st.managers.find(x=>x.id===S.myId);
    if(!m) return false;
    if(m.squad.filter(s=>s.retained).length>=RETENTION_SLOTS) return false;
    const p = st.pool.find(x=>x.id===playerId);
    if(!p || p.status!=="available") return false;
    if(p.team2025 && p.team2025 !== m.team) return false; // Can only retain players from your 2025 team
    if(p.isOverseas && m.squad.filter(s=>s.isOverseas).length>=MAX_OVERSEAS) return false;
    p.status="retained"; p.ownerId=m.id; p.price=0;
    m.squad.push({playerId:p.id,name:p.name,role:p.role,country:p.country,isOverseas:p.isOverseas,rating:p.rating,price:0,retained:true});
    return st;
  });
}
async function actionUndoRetain(playerId){
  await mutateRoom(S.roomCode, st=>{
    const m = st.managers.find(x=>x.id===S.myId);
    const p = st.pool.find(x=>x.id===playerId);
    if(!m||!p||p.ownerId!==m.id) return false;
    p.status="available"; p.ownerId=null;
    m.squad = m.squad.filter(s=>s.playerId!==playerId);
    return st;
  });
}
async function actionStartAuction(){
  await mutateRoom(S.roomCode, st=>{
    // Build alternating Indian/Foreign order for fairness
    const availablePool = st.pool.filter(p=>p.status==="available");
    const indian = shuffle(availablePool.filter(p=>!p.isOverseas).map(p=>p.id));
    const foreign = shuffle(availablePool.filter(p=>p.isOverseas).map(p=>p.id));
    // Interleave: foreign, indian, foreign, indian... (1 foreign every 2 players)
    const ordered = [];
    let fi=0, ii=0;
    while(fi<foreign.length || ii<indian.length){
      if(fi<foreign.length) ordered.push(foreign[fi++]);
      if(ii<indian.length) ordered.push(indian[ii++]);
      if(ii<indian.length) ordered.push(indian[ii++]); // extra indian to balance
    }
    st.auction.order = ordered;
    st.auction.idx = -1;
    st.auction.round="main";
    st.phase="auction";
    return advanceToNextPlayer(st);
  });
}
async function actionPlaceBid(){
  await mutateRoom(S.roomCode, st=>{
    const a = st.auction;
    if(a.status!=="live") return false;
    const mgr = st.managers.find(m=>m.id===S.myId);
    const pool = st.pool.find(p=>p.id===a.currentPlayerId);
    const amt = nextBidAmount(a.currentBid);
    const chk = canBid(mgr,pool,amt);
    if(!chk.ok) return false;
    if(mgr.id===a.currentBidderId) return false; // can't outbid yourself
    a.currentBid = amt; a.currentBidderId = mgr.id;
    const now = Date.now();
    const curEnd = a.endsAt || (now + 10000);
    // Add +1s on every bid, strictly capped at 10 seconds (now + 10000ms)
    a.endsAt = Math.min(now + 10000, curEnd + 1000);
    st.bidFeed.unshift({manager:mgr.name,team:mgr.team,amount:amt,time:now});
    st.bidFeed = st.bidFeed.slice(0,40);
    return st;
  });
}
async function actionHostSkip(){
  await mutateRoom(S.roomCode, st=>{
    const a = st.auction;
    if(a.status!=="live") return false;
    const pool = st.pool.find(p=>p.id===a.currentPlayerId);
    if(pool) pool.status="unsold";
    st.history.unshift({type:"unsold",playerId:pool?pool.id:null,name:pool?pool.name:"?",time:Date.now()});
    a.status="unsold"; a.resultAt=Date.now();
    return st;
  });
}
async function actionHostPause(){
  await mutateRoom(S.roomCode, st=>{
    if(st.auction.status!=="live") return false;
    st.auction._pausedEndsAt = st.auction.endsAt;
    st.auction.status="paused";
    return st;
  });
}
async function actionHostResume(){
  await mutateRoom(S.roomCode, st=>{
    if(st.auction.status!=="paused") return false;
    const remain = Math.max(2000,(st.auction._pausedEndsAt||Date.now())-Date.now());
    st.auction.endsAt = Date.now()+remain;
    st.auction.status="live";
    return st;
  });
}
async function actionStartUnsoldRound(){
  await mutateRoom(S.roomCode, st=>{
    const unsold = st.pool.filter(p=>p.status==="unsold");
    if(unsold.length===0) return false;
    unsold.forEach(p=>p.status="available");
    st.auction.order = shuffle(unsold.map(p=>p.id));
    st.auction.idx=-1; st.auction.round="unsold";
    return advanceToNextPlayer(st);
  });
}
async function actionFinishAuction(){
  await mutateRoom(S.roomCode, st=>{
    st.results = computeResults(st);
    st.phase="results";
    return st;
  });
}
async function actionRestart(){
  await mutateRoom(S.roomCode, st=>{
    const managers = st.managers.map(m=>newManager(m.id,m.name,m.isHost));
    const fresh = initialRoomState(st.code, managers[0].id, managers[0].name);
    fresh.managers = managers;
    return fresh;
  });
}

/* ---------------- Evaluation Engine ---------------- */
function computeResults(st){
  const roleIdeal = {BATTER:[4,6],BOWLER:[4,6],ALL_ROUNDER:[2,4],WICKETKEEPER:[1,3]};
  const teamResults = st.managers.map(m=>{
    const squad = m.squad;
    const n = squad.length || 1;
    const avgRating = squad.reduce((a,s)=>a+s.rating,0)/n;
    const playerQuality = Math.round(avgRating);

    const counts = {BATTER:0,BOWLER:0,ALL_ROUNDER:0,WICKETKEEPER:0};
    squad.forEach(s=>counts[s.role]++);
    let penalty=0;
    Object.keys(roleIdeal).forEach(r=>{
      const [lo,hi]=roleIdeal[r]; const c=counts[r];
      if(c<lo) penalty += (lo-c)*8; else if(c>hi) penalty += (c-hi)*5;
    });
    const roleBalance = Math.max(0, Math.round(100-penalty));

    const squadDepth = Math.round(Math.min(100,(squad.length/MAX_SQUAD)*100) * (0.55+0.45*(avgRating/100)));

    const overseasCount = squad.filter(s=>s.isOverseas).length;
    const overseasBalance = Math.max(0, Math.round(100 - Math.abs(overseasCount-4)*11));

    const bought = squad.filter(s=>!s.retained);
    let budgetEfficiency = 75;
    if(bought.length){
      const spent = bought.reduce((a,s)=>a+s.price,0);
      const avgPricePerRating = spent / bought.reduce((a,s)=>a+s.rating,0);
      budgetEfficiency = Math.max(0, Math.min(100, Math.round(100 - (avgPricePerRating*1400))));
    }

    const finalScore = round2(
      playerQuality*0.40 + roleBalance*0.25 + squadDepth*0.15 + overseasBalance*0.10 + budgetEfficiency*0.10
    );

    const bestXI = generateBestXI(squad);
    const strongest = ["playerQuality","roleBalance","squadDepth","overseasBalance","budgetEfficiency"]
      .reduce((best,k)=>{
        const vals={playerQuality,roleBalance,squadDepth,overseasBalance,budgetEfficiency};
        return vals[k]>vals[best]?k:best;
      },"playerQuality");
    const weakest = ["playerQuality","roleBalance","squadDepth","overseasBalance","budgetEfficiency"]
      .reduce((w,k)=>{
        const vals={playerQuality,roleBalance,squadDepth,overseasBalance,budgetEfficiency};
        return vals[k]<vals[w]?k:w;
      },"playerQuality");
    const AREA_LABEL={playerQuality:"Overall Player Quality",roleBalance:"Role Balance",squadDepth:"Squad Depth",overseasBalance:"Overseas Balance",budgetEfficiency:"Budget Efficiency"};

    let verdict = "Solid, workable squad.";
    if(finalScore>=88) verdict="Elite, championship-calibre squad.";
    else if(finalScore>=78) verdict="Excellent, well-balanced squad.";
    else if(finalScore>=65) verdict="Decent squad with clear gaps.";
    else verdict="Undercooked squad — needs a rethink next season.";

    const bestPlayer = squad.slice().sort((a,b)=>b.rating-a.rating)[0];
    const boughtSorted = bought.slice().sort((a,b)=>b.price-a.price);
    const mostExpensive = boughtSorted[0];
    const bestValue = bought.slice().sort((a,b)=>(b.rating/(b.price||0.5))-(a.rating/(a.price||0.5)))[0];

    return {
      managerId:m.id, managerName:m.name, team:m.team,
      playerQuality, roleBalance, squadDepth, overseasBalance, budgetEfficiency, finalScore,
      strongestArea:AREA_LABEL[strongest], weakestArea:AREA_LABEL[weakest], verdict,
      bestXI, bestPlayer, mostExpensive, bestValue,
      squadSize:squad.length, overseasCount, purseRemaining:m.purse, counts
    };
  });
  teamResults.sort((a,b)=>b.finalScore-a.finalScore);
  return {teams:teamResults, computedAt:Date.now()};
}
function generateBestXI(squad){
  if(squad.length===0) return {xi:[],impact:null};
  const sorted = squad.slice().sort((a,b)=>b.rating-a.rating);
  const xi=[]; const used=new Set();
  const wk = sorted.find(s=>s.role==="WICKETKEEPER");
  if(wk){xi.push(wk);used.add(wk.playerId);}
  const bowlersNeeded=4;
  let bowlerCount=0;
  const bowlPool = sorted.filter(s=>!used.has(s.playerId) && (s.role==="BOWLER"||s.role==="ALL_ROUNDER"));
  for(const p of bowlPool){
    if(bowlerCount>=bowlersNeeded) break;
    if(p.role==="BOWLER"){xi.push(p);used.add(p.playerId);bowlerCount++;}
  }
  for(const s of sorted){
    if(xi.length>=11) break;
    if(used.has(s.playerId)) continue;
    xi.push(s); used.add(s.playerId);
  }
  let i=0;
  while(xi.length<11 && i<sorted.length){
    if(!used.has(sorted[i].playerId)){xi.push(sorted[i]);used.add(sorted[i].playerId);}
    i++;
  }
  const finalXI = xi.slice(0,11).sort((a,b)=>{
    const order={WICKETKEEPER:1,BATTER:0,ALL_ROUNDER:2,BOWLER:3};
    return order[a.role]-order[b.role];
  });
  const remaining = sorted.filter(s=>!finalXI.find(x=>x.playerId===s.playerId));
  const impact = remaining[0] || null;
  return {xi:finalXI, impact};
}

      ${managers.map(m=>`<div class="player-row"><div class="left"><span class="dot ${isConnected(m)?'on':'off'}"></span>${m.name} <span class="faint">(${m.team||'None'})</span></div>
        <div class="mono" style="font-weight:700;color:${(Array.isArray(m.squad)?m.squad.filter(s=>s&&s.retained).length:0)>=3?'#3ddc84':'#9aa5b4'};">${Array.isArray(m.squad)?m.squad.filter(s=>s&&s.retained).length:0}/3</div></div>`).join("")}
      ${amHost()?`<button class="btn btn-gold btn-block" style="margin-top:14px;" id="btnStartAuc">Start Auction${allDone?'':' (can skip remaining)'}</button>`:''}
    </div>
  </div>`;

  document.getElementById("retSearch").oninput=(e)=>{S._retSearch=e.target.value;render();};
  document.getElementById("retRole").onchange=(e)=>{S._retRole=e.target.value;render();};

  // Preserve scroll position
  const pgrid = document.querySelector(".pgrid-scroll");
  if(pgrid){
    if(S._retScrollTop !== undefined) pgrid.scrollTop = S._retScrollTop;
    pgrid.onscroll = (e) => { S._retScrollTop = e.target.scrollTop; };
  }

  document.querySelectorAll("[data-retain]").forEach(el=>{
    el.onclick=()=>actionRetainPlayer(el.dataset.retain);
  });
  document.querySelectorAll("[data-unretain]").forEach(el=>{
    el.onclick=()=>actionUndoRetain(el.dataset.unretain);
  });
  const btnStartAuc = document.getElementById("btnStartAuc");
  if(amHost() && btnStartAuc) {
    btnStartAuc.onclick = actionStartAuction;
  }
}

              <div class="bid-amount">${fmtCr(a.currentBid)}</div>
              <div class="bid-leader">${leaderMgr?('Leading: '+leaderMgr.team+' — '+leaderMgr.name):'No bids yet'}</div>

          ${(()=>{
            const viewMgr = r.managers.find(m=>m.id===(S._squadTab||r.managers[0].id)) || r.managers[0];

            const ovs = (viewMgr.squad||[]).filter(s=>s&&s.isOverseas).length;
            return `<div style="font-size:11px;color:var(--ink-faint);margin-bottom:6px;">${viewMgr.name} · ${(viewMgr.squad||[]).length}/${MAX_SQUAD} players · ${ovs}/${MAX_OVERSEAS} overseas · ${fmtCr(viewMgr.purse)} purse</div>

        <div class="card" style="max-height:260px;overflow-y:auto;padding:12px 14px;">
          ${r.history.slice(0,15).map(h=>{
            if(h.type==="sold") return `<div class="feed-item">🔨 <b>${h.name}</b> → ${h.team} for ${fmtCr(h.price)}</div>`;
            if(h.type==="unsold") return `<div class="feed-item">${h.name} went <b>unsold</b></div>`;
            return `<div class="feed-item"><b>${h.name}</b> entered the auction</div>`;

      S._aucPoolSearch = e.target.value;
      render();
    };
  }
  // Squad tab switching
  document.querySelectorAll("[data-squadtab]").forEach(el=>{
    el.onclick=()=>{ S._squadTab=el.dataset.squadtab; render(); };
  });

  // Bid button — optimistic local update for instant feel, then server write
  const bBid=document.getElementById("btnBid");
  if(bBid) bBid.onclick=()=>{
    // Optimistic: update local state immediately
    const a2=S.room.auction;
    const m2=myManager();
    const p2=S.room.pool.find(p=>p&&p.id===a2.currentPlayerId);
    const amt2=nextBidAmount(a2.currentBid);
    if(a2.status==="live" && m2 && p2 && m2.id!==a2.currentBidderId && canBid(m2,p2,amt2).ok){
      a2.currentBid=amt2; a2.currentBidderId=m2.id;
      const now2=Date.now();
      a2.endsAt=Math.min(now2+10000,(a2.endsAt||now2+10000)+1000);
      if(!S.room.bidFeed) S.room.bidFeed=[];
      S.room.bidFeed.unshift({manager:m2.name,team:m2.team,amount:amt2,time:now2});
      render(); // instant UI update
    }
    actionPlaceBid(); // async server commit
  };
  const bSkip=document.getElementById("btnSkip"); if(bSkip) bSkip.onclick=actionHostSkip;
  const bPause=document.getElementById("btnPause"); if(bPause) bPause.onclick=actionHostPause;
  const bResume=document.getElementById("btnResume"); if(bResume) bResume.onclick=actionHostResume;

  // local 1s ticker for the countdown display without waiting for storage roundtrip
  if(S._tickTimer) clearInterval(S._tickTimer);
  if(a.status==="live"){
    S._tickTimer = setInterval(()=>{
      if(S.room && S.room.phase==="auction" && S.room.auction.status==="live"){
        const el = document.querySelector(".timer-num");
        if(el){
          const s = Math.max(0, Math.ceil((S.room.auction.endsAt-Date.now())/1000));
          el.textContent = s+"s";
          el.classList.toggle("warn", s<=5);
        }
      } else { clearInterval(S._tickTimer); }
    },300);
  }
}

              return `<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span class="dim">${labels[k]}</span><span class="mono">${t[k]}</span></div><div class="progress"><div class="fill" style="width:${t[k]}%;"></div></div></div>`;
            }).join("")}
            <div class="faint" style="font-size:12px;margin-top:6px;">Strongest: <b style="color:var(--good);">${t.strongestArea}</b> · Weakest: <b style="color:var(--danger);">${t.weakestArea}</b></div>
          </div>`).join("")}
      </div>
    ` : ""}

    ${view==='myteam' ? `
      <div class="card">
        <div class="section-title">${myResult.team} — ${myResult.managerName}</div>
        <div class="stat-row">
          <div class="stat-box"><div class="num">${myResult.finalScore.toFixed(1)}</div><div class="lbl">Final Score</div></div>
          <div class="stat-box"><div class="num">${myResult.counts.BATTER}</div><div class="lbl">Batters</div></div>
          <div class="stat-box"><div class="num">${myResult.counts.BOWLER}</div><div class="lbl">Bowlers</div></div>
          <div class="stat-box"><div class="num">${myResult.counts.ALL_ROUNDER}</div><div class="lbl">All-Rounders</div></div>
          <div class="stat-box"><div class="num">${myResult.counts.WICKETKEEPER}</div><div class="lbl">Wicketkeepers</div></div>
        </div>
        <div style="margin-top:14px;" class="dim">
          Best Player: <b style="color:var(--gold-2);">${myResult.bestPlayer?myResult.bestPlayer.name:'—'}</b> ·
          Best Value: <b style="color:var(--good);">${myResult.bestValue?myResult.bestValue.name:'—'}</b> ·
          Most Expensive: <b style="color:var(--flood);">${myResult.mostExpensive?myResult.mostExpensive.name:'—'}</b>
        </div>
        <div class="squad-grid">
          ${me.squad.map(s=>renderMiniPlayerCard(s,false)).join("")}
        </div>
      </div>
    `:""}

    ${view==='bestxi' ? `
      <div class="lobby-grid">
        ${res.teams.map(t=>`
          <div class="card">
            <div class="section-title">${t.team} Best XI</div>
            ${t.bestXI.xi.map((p,i)=>`<div class="player-row"><div class="left"><span class="faint mono" style="width:18px;display:inline-block;">${i+1}</span>${p.name}</div><div class="faint" style="font-size:11px;">${ROLE_LABEL[p.role]} · ⭐${p.rating}</div></div>`).join("")}
            ${t.bestXI.impact?`<div class="faint" style="margin-top:8px;font-size:12px;">Impact Player: <b style="color:var(--gold-2);">${t.bestXI.impact.name}</b></div>`:''}
          </div>`).join("")}
      </div>
    `:""}

    ${view==='history' ? `
      <div class="card">
        <div class="section-title">Full Auction History</div>
        ${r.history.slice().reverse().map(h=>{
          if(h.type==="sold") return `<div class="feed-item">🔨 <b>${h.name}</b> → ${h.team} for ${fmtCr(h.price)}</div>`;
          if(h.type==="unsold") return `<div class="feed-item">${h.name} went <b>unsold</b></div>`;
          return `<div class="feed-item"><b>${h.name}</b> entered the auction</div>`;
        }).join("") || '<div class="empty-state">No history.</div>'}
      </div>
    `:""}

    ${amHost()?`<button class="btn btn-danger" style="margin-top:20px;" id="btnRestart">Restart Game</button>`:""}
  </div>`;

  document.querySelectorAll("[data-view]").forEach(el=>{
    el.onclick=()=>{S._resultView=el.dataset.view; render();};
  });
  const bR=document.getElementById("btnRestart");
  if(bR) bR.onclick=()=>{
    if(confirm("Reset this room? All teams, bids, purchases and progress will be deleted.")) actionRestart();
  };
}

render();
</script>
</body>
</html>
